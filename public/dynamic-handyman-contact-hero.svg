<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2a44" />
      <stop offset="50%" stop-color="#0e3759" />
      <stop offset="100%" stop-color="#092036" />
    </linearGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="blueprintGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2563eb" stroke-width="0.5" stroke-opacity="0.15" />
    </pattern>

    <!-- Sub-grid Pattern -->
    <pattern id="subGrid" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.12" />
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="1600" height="680" fill="url(#bgGrad)" />
  <rect width="1600" height="680" fill="url(#blueprintGrid)" />
  <rect width="1600" height="680" fill="url(#subGrid)" />

  <!-- Global Technical Alignment Lines -->
  <line x1="0" y1="520" x2="1600" y2="520" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="4 8" stroke-opacity="0.25" />
  <line x1="80" y1="0" x2="80" y2="680" stroke="#38bdf8" stroke-width="0.5" stroke-dasharray="2 6" stroke-opacity="0.2" />

  <!-- LEFT TECHNICAL CALLOUT / RADAR TARGET (x: 60, y: 180) -->
  <g transform="translate(60, 180)" stroke="#38bdf8" stroke-opacity="0.4" fill="none">
    <line x1="-50" y1="0" x2="50" y2="0" stroke-width="0.75" />
    <line x1="0" y1="-50" x2="0" y2="50" stroke-width="0.75" />
    <polygon points="0,-36 36,0 0,36 -36,0" stroke-width="0.75" />
    <polygon points="0,-24 24,0 0,24 -24,0" stroke-width="0.75" />
    <polygon points="0,-12 12,0 0,12 -12,0" stroke-width="0.75" />
    <circle cx="0" cy="0" r="2.5" fill="#e0f2fe" stroke="none" />
  </g>

  <!-- RIGHT TECHNICAL BLUEPRINT HARNESS (Center ~ x: 1150, y: 330) -->
  <g id="blueprint-harness" transform="translate(1150, 330)">
    <!-- Dimension Measure Line: Top Horizontal -->
    <line x1="-220" y1="-245" x2="220" y2="-245" stroke="#bae6fd" stroke-width="1.2" stroke-opacity="0.6" />
    <rect x="-222" y="-247" width="4" height="4" fill="#ffffff" />
    <rect x="218" y="-247" width="4" height="4" fill="#ffffff" />

    <!-- Dimension Measure Line: Right Vertical -->
    <line x1="310" y1="-210" x2="310" y2="215" stroke="#bae6fd" stroke-width="1.2" stroke-opacity="0.6" />
    <rect x="308" y="-212" width="4" height="4" fill="#ffffff" />
    <rect x="308" y="213" width="4" height="4" fill="#ffffff" />

    <!-- Center Axes -->
    <line x1="-260" y1="0" x2="260" y2="0" stroke="#bae6fd" stroke-width="1.2" stroke-opacity="0.6" />
    <line x1="0" y1="-260" x2="0" y2="260" stroke="#bae6fd" stroke-width="1.2" stroke-opacity="0.6" />

    <!-- Concentric Technical Circles -->
    <circle cx="0" cy="0" r="215" fill="none" stroke="#bae6fd" stroke-width="1" stroke-dasharray="4 6" stroke-opacity="0.35" />
    <circle cx="0" cy="0" r="175" fill="none" stroke="#bae6fd" stroke-width="0.75" stroke-opacity="0.25" />

    <!-- Diagonal Construction Lines -->
    <line x1="-210" y1="-210" x2="210" y2="210" stroke="#bae6fd" stroke-width="0.75" stroke-opacity="0.25" />
    <line x1="-210" y1="210" x2="210" y2="-210" stroke="#bae6fd" stroke-width="0.75" stroke-opacity="0.25" />

    <!-- Concentric Architectural Diamonds -->
    <!-- Large Outer Diamond -->
    <polygon points="0,-215 215,0 0,215 -215,0" fill="none" stroke="#e0f2fe" stroke-width="2" stroke-opacity="0.9" />
    <!-- Middle Diamond -->
    <polygon points="0,-165 165,0 0,165 -165,0" fill="none" stroke="#bae6fd" stroke-width="1.2" stroke-opacity="0.5" />
    <!-- Inner Diamond -->
    <polygon points="0,-115 115,0 0,115 -115,0" fill="none" stroke="#7dd3fc" stroke-width="1" stroke-opacity="0.35" />

    <!-- Axis Center Diamond Node -->
    <polygon points="0,-11 11,0 0,11 -11,0" fill="#ffffff" />

    <!-- Outer Nodes -->
    <circle cx="0" cy="-215" r="4.5" fill="#ffffff" />
    <circle cx="0" cy="215" r="4.5" fill="#ffffff" />
    <circle cx="-215" cy="0" r="4.5" fill="#ffffff" />
    <circle cx="215" cy="0" r="4.5" fill="#ffffff" />

    <!-- Connector Stem to Envelope (Middle Icon) -->
    <line x1="215" y1="0" x2="240" y2="0" stroke="#e0f2fe" stroke-width="2" stroke-opacity="0.9" />

    <!-- ICON 1: CHAT / SPEECH BUBBLE (Top Right) -->
    <g transform="translate(112, -180)">
      <!-- Outer Box -->
      <rect x="0" y="0" width="122" height="100" fill="#0c2b44" fill-opacity="0.8" stroke="#bae6fd" stroke-width="2" stroke-opacity="0.85" />
      <g transform="translate(23, 17)" fill="none" stroke="#e0f2fe" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <!-- Speech Bubble -->
        <path d="M 6 4 L 70 4 C 73 4 75 6 75 9 L 75 49 C 75 52 73 54 70 54 L 28 54 L 14 66 L 14 54 L 6 54 C 3 54 1 52 1 49 L 1 9 C 1 6 3 4 6 4 Z" />
        <!-- Message Lines inside bubble -->
        <line x1="16" y1="20" x2="60" y2="20" stroke-width="2.5" />
        <line x1="16" y1="32" x2="48" y2="32" stroke-width="2.5" />
      </g>
    </g>

    <!-- ICON 2: ENVELOPE / DIRECT EMAIL (Center Right) -->
    <g transform="translate(240, -50)">
      <!-- Outer Double-Border Box -->
      <rect x="0" y="0" width="124" height="100" fill="#0c2b44" fill-opacity="0.8" stroke="#bae6fd" stroke-width="2" stroke-opacity="0.85" />
      <g transform="translate(20, 20)" fill="none" stroke="#e0f2fe" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <!-- Envelope Body -->
        <rect x="2" y="4" width="80" height="52" />
        <!-- Envelope Flap & Creases -->
        <polyline points="2,4 42,34 82,4" />
        <line x1="2" y1="56" x2="32" y2="28" stroke-width="1.8" />
        <line x1="82" y1="56" x2="52" y2="28" stroke-width="1.8" />
      </g>
    </g>

    <!-- ICON 3: PHONE / TELEPHONE RECEIVER (Bottom Right) -->
    <g transform="translate(112, 80)">
      <!-- Outer Box -->
      <rect x="0" y="0" width="122" height="100" fill="#0c2b44" fill-opacity="0.85" stroke="#bae6fd" stroke-width="2" stroke-opacity="0.85" />
      <g transform="translate(32, 21) scale(2.4)" fill="none" stroke="#e0f2fe" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <!-- Iconic Telephone Receiver Handset -->
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />
      </g>
    </g>
  </g>
</svg>
