<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="aboutBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2a44" />
      <stop offset="50%" stop-color="#0e3759" />
      <stop offset="100%" stop-color="#092036" />
    </linearGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="aboutGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2563eb" stroke-width="0.5" stroke-opacity="0.15" />
    </pattern>

    <!-- Sub-grid Pattern -->
    <pattern id="aboutSubGrid" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.12" />
    </pattern>

    <!-- Diagonal Hatching for Eaves & Section -->
    <pattern id="diagHatch" width="12" height="12" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#bae6fd" stroke-width="1.2" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1600" height="680" fill="url(#aboutBgGrad)" />
  <rect width="1600" height="680" fill="url(#aboutGrid)" />
  <rect width="1600" height="680" fill="url(#aboutSubGrid)" />

  <!-- Global Blueprint Baseline & Guides -->
  <line x1="0" y1="600" x2="1600" y2="600" stroke="#bae6fd" stroke-width="1.5" stroke-opacity="0.5" />
  <line x1="0" y1="520" x2="1600" y2="520" stroke="#38bdf8" stroke-width="0.6" stroke-dasharray="4 8" stroke-opacity="0.2" />

  <!-- LEFT TECHNICAL MARKERS -->
  <g stroke="#38bdf8" stroke-opacity="0.3" fill="none">
    <line x1="100" y1="120" x2="100" y2="160" stroke-width="0.75" />
    <line x1="80" y1="140" x2="120" y2="140" stroke-width="0.75" />
    <circle cx="100" cy="140" r="1.5" fill="#38bdf8" />

    <line x1="280" y1="0" x2="480" y2="200" stroke-width="0.75" stroke-dasharray="3 6" stroke-opacity="0.2" />
    <line x1="160" y1="480" x2="300" y2="480" stroke-width="0.75" stroke-opacity="0.25" />
  </g>

  <!-- RIGHT ARCHITECTURAL HOUSE & BLUEPRINT GEOMETRY -->
  <g id="architectural-house-group">
    <!-- Background Blueprint Construction Circle -->
    <circle cx="1110" cy="350" r="230" fill="none" stroke="#bae6fd" stroke-width="0.8" stroke-dasharray="4 6" stroke-opacity="0.3" />
    <circle cx="1110" cy="350" r="180" fill="none" stroke="#bae6fd" stroke-width="0.6" stroke-opacity="0.2" />

    <!-- Rotated Diamonds in Background of House -->
    <polygon points="1110,120 1340,350 1110,580 880,350" fill="none" stroke="#bae6fd" stroke-width="1.2" stroke-opacity="0.4" />
    <polygon points="1110,170 1290,350 1110,530 930,350" fill="none" stroke="#bae6fd" stroke-width="0.8" stroke-opacity="0.25" />

    <!-- Diamond Center Node -->
    <polygon points="1110,342 1118,350 1110,358 1102,350" fill="#ffffff" />
    <circle cx="1000" cy="460" r="3.5" fill="#ffffff" />

    <!-- Plumb Line Axis through Peak -->
    <line x1="1310" y1="50" x2="1310" y2="600" stroke="#bae6fd" stroke-width="1" stroke-dasharray="4 6" stroke-opacity="0.5" />
    <line x1="1310" y1="30" x2="1310" y2="60" stroke="#bae6fd" stroke-width="1" stroke-opacity="0.6" />

    <!-- Dimension Measure Line Under House Base -->
    <line x1="970" y1="635" x2="1590" y2="635" stroke="#bae6fd" stroke-width="1.2" stroke-opacity="0.5" />
    <line x1="1040" y1="625" x2="1040" y2="645" stroke="#bae6fd" stroke-width="1.2" stroke-opacity="0.6" />
    <line x1="1550" y1="625" x2="1550" y2="645" stroke="#bae6fd" stroke-width="1.2" stroke-opacity="0.6" />

    <!-- Diagonal Hatch Shading Under Right Eave -->
    <polygon points="1310,140 1545,340 1545,430 1310,240" fill="url(#diagHatch)" opacity="0.6" />
    <!-- Diagonal Hatch Shading Inside Left Portal -->
    <polygon points="1040,465 1160,380 1160,600 1040,600" fill="url(#diagHatch)" opacity="0.35" />

    <!-- MAIN ARCHITECTURAL HOUSE WIREFRAME -->
    <!-- Outer Roof & Wall Facade Contour -->
    <polyline points="1025,470 1310,105 1550,380" fill="none" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Ridge Node -->
    <circle cx="1310" cy="105" r="4.5" fill="#ffffff" />
    <circle cx="1550" cy="380" r="4" fill="#ffffff" />

    <!-- Inner Roof Pitch Line (Fascia Thickness) -->
    <polyline points="1040,465 1310,140 1530,375" fill="none" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Outer Walls down to Foundation -->
    <line x1="1040" y1="465" x2="1040" y2="600" stroke="#e0f2fe" stroke-width="2.2" stroke-linecap="round" />
    <line x1="1520" y1="375" x2="1520" y2="600" stroke="#e0f2fe" stroke-width="1.5" stroke-opacity="0.8" />
    <line x1="1550" y1="380" x2="1550" y2="600" stroke="#bae6fd" stroke-width="1.2" stroke-opacity="0.5" />

    <!-- Inner Architectural Gable & Internal Structural Lines -->
    <polyline points="1075,465 1310,220 1520,430" fill="none" stroke="#bae6fd" stroke-width="1.5" stroke-opacity="0.75" />
    <line x1="1310" y1="140" x2="1310" y2="600" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" />

    <!-- PERSPECTIVE DOORWAY (OPENING IN CENTER-LEFT) -->
    <!-- Door Jambs -->
    <line x1="1170" y1="600" x2="1170" y2="395" stroke="#e0f2fe" stroke-width="2.2" stroke-linecap="round" />
    <line x1="1270" y1="600" x2="1270" y2="330" stroke="#e0f2fe" stroke-width="2.2" stroke-linecap="round" />
    <line x1="1170" y1="395" x2="1270" y2="330" stroke="#e0f2fe" stroke-width="2.2" stroke-linecap="round" />
    
    <!-- Open Door Leaf in Perspective -->
    <polygon points="1170,395 1240,435 1240,600 1170,600" fill="#0e3759" fill-opacity="0.85" stroke="#e0f2fe" stroke-width="2" stroke-linejoin="round" />

    <!-- PERSPECTIVE WINDOW (ON RIGHT WALL) -->
    <!-- Outer Window Frame -->
    <polygon points="1360,430 1480,480 1480,610 1360,560" fill="#0a2a44" fill-opacity="0.7" stroke="#e0f2fe" stroke-width="2" stroke-linejoin="round" />
    <!-- Inner Window Glass Reveal -->
    <polygon points="1375,450 1465,490 1465,595 1375,550" fill="none" stroke="#bae6fd" stroke-width="1.5" stroke-linejoin="round" />

    <!-- Ground Level Slab Double Foundation -->
    <line x1="1010" y1="600" x2="1590" y2="600" stroke="#e0f2fe" stroke-width="2.5" />
    <line x1="1025" y1="608" x2="1575" y2="608" stroke="#bae6fd" stroke-width="1.2" stroke-opacity="0.7" />
  </g>
</svg>
